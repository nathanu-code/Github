<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Jost', 'Century Gothic', 'Futura', sans-serif; }
    a { color: #8E5B48; } a:hover { color: #6F4234; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #E3E1DE; box-sizing: border-box; padding: 88px 64px 58px; display: flex; flex-direction: column;">

  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <linearGradient id="c8rose" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#7E4E3D"/><stop offset="0.24" stop-color="#C08A70"/>
        <stop offset="0.5" stop-color="#F0D3BE"/><stop offset="0.74" stop-color="#CE9679"/>
        <stop offset="1" stop-color="#6F4234"/>
      </linearGradient>
      <linearGradient id="c8glass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#B9B5B0" stop-opacity="0.34"/>
        <stop offset="0.44" stop-color="#FFFFFF" stop-opacity="0.94"/>
        <stop offset="1" stop-color="#B9B5B0" stop-opacity="0.30"/>
      </linearGradient>
      <linearGradient id="c8serum" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F2DCC8"/><stop offset="1" stop-color="#DDB393"/>
      </linearGradient>
      <radialGradient id="c8mist" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#C08A70" stop-opacity="0.30"/>
        <stop offset="0.55" stop-color="#C08A70" stop-opacity="0.09"/>
        <stop offset="1" stop-color="#C08A70" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>

  <h1 style="margin: 0; font-family: 'Marcellus', Georgia, serif; font-size: 66px; line-height: 1.12; color: #191219; text-align: center; text-wrap: balance;">Your fingertips drink the serum before your skin does.</h1>

  <div style="margin-top: 24px; text-align: center; font-size: 32px; line-height: 1.4; color: #3A3430;">
    This is <strong style="font-weight: 600;">touchless delivery.</strong><br><span style="font-weight: 600;">NOT</span> another cream.
  </div>

  <div style="display: flex; align-items: stretch; gap: 26px; margin-top: 40px; flex-grow: 1;">

    <div style="display: flex; flex-direction: column; justify-content: center; gap: 62px; width: 470px; flex-shrink: 0;">

      <div>
        <div style="display: flex; align-items: baseline; gap: 12px;">
          <span style="font-size: 96px; font-weight: 700; line-height: 0.92; letter-spacing: -0.03em; color: #191219;">8%</span>
          <span style="font-family: 'Space Mono', 'Courier New', monospace; font-size: 17px; letter-spacing: 0.10em; color: #8E5B48;">vs 5% standard</span>
        </div>
        <div style="margin-top: 8px; font-size: 27px; line-height: 1.3; color: #3A3430;">stem cell conditioned media</div>
      </div>

      <div>
        <div style="font-size: 96px; font-weight: 700; line-height: 0.92; letter-spacing: -0.03em; color: #191219;">1 week</div>
        <div style="margin-top: 8px; font-size: 27px; line-height: 1.3; color: #3A3430;">to visible refinement</div>
      </div>

      <div>
        <div style="display: flex; align-items: baseline; gap: 14px;">
          <span style="font-size: 96px; font-weight: 700; line-height: 0.92; letter-spacing: -0.03em; color: #191219;">0</span>
          <span style="font-size: 34px; font-weight: 500; color: #191219;">contact</span>
        </div>
        <div style="margin-top: 8px; font-size: 27px; line-height: 1.3; color: #3A3430;">no hands, no needles, no downtime</div>
      </div>

    </div>

    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 260 470" width="290" height="524" role="img" aria-label="The Stellar Airbrush misting">
        <ellipse cx="130" cy="62" rx="122" ry="52" fill="url(#c8mist)"/>
        <circle cx="86" cy="52" r="4.5" fill="#C08A70" opacity="0.40"/>
        <circle cx="134" cy="26" r="3.4" fill="#C08A70" opacity="0.34"/>
        <circle cx="176" cy="58" r="5" fill="#C08A70" opacity="0.30"/>
        <circle cx="108" cy="82" r="3" fill="#C08A70" opacity="0.28"/>
        <circle cx="164" cy="94" r="3.6" fill="#C08A70" opacity="0.24"/>
        <path d="M114 108 h32 l-5 24 h-22 z" fill="#EBD7C6"/>
        <path d="M88 132 h84 a13 13 0 0 1 13 13 v56 a38 38 0 0 1 -38 38 h-34 a38 38 0 0 1 -38 -38 v-56 a13 13 0 0 1 13 -13 z" fill="url(#c8glass)" stroke="#C9C4BE" stroke-width="2.5"/>
        <path d="M97 190 h66 a35 35 0 0 1 -33 47 h0 a35 35 0 0 1 -33 -47 z" fill="url(#c8serum)" opacity="0.85"/>
        <rect x="74" y="236" width="112" height="196" rx="54" fill="url(#c8rose)"/>
        <rect x="93" y="248" width="13" height="172" rx="6.5" fill="#FFFFFF" opacity="0.24"/>
        <circle cx="130" cy="306" r="19" fill="#2A1B18" opacity="0.42"/>
        <circle cx="130" cy="306" r="10" fill="#F0D3BE" opacity="0.5"/>
        <ellipse cx="130" cy="442" rx="86" ry="12" fill="#191219" opacity="0.13"/>
      </svg>
    </div>

  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #C6C2BD; padding-top: 22px;">
    <div style="font-family: 'Marcellus', Georgia, serif; font-size: 30px; letter-spacing: 0.06em; color: #191219;">JULLIEN STELLAR</div>
    <div style="font-family: 'Space Mono', 'Courier New', monospace; font-size: 17px; letter-spacing: 0.14em; text-transform: uppercase; color: #8E5B48;">Engineered in Seoul</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#B5836E","options":["#B5836E","#4A2B3C","#8E5B48","#D9AE99"]}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#B5836E' }; }
}
</script>
</body>
</html>
